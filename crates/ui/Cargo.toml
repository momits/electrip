[package]
name = "electrip-ui"
description = "User interface of Electrip 2"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
electrip-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }

# Slint's text layout (fontique) uses fontconfig on Linux; loaded at run time,
# building needs no fontconfig headers (none in CI).
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3"

[lints]
workspace = true
