[package]
name = "electrip"
description = "Electrip 2 – model railway control with gamepads"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
electrip-audio = { path = "../audio" }
electrip-control = { path = "../control" }
electrip-core = { path = "../core" }
electrip-input = { path = "../input" }
electrip-station-srcp = { path = "../station-srcp" }
electrip-station-z21 = { path = "../station-z21" }

[dev-dependencies]
electrip-sim-z21 = { path = "../../sim/z21" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
