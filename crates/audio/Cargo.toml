[package]
name = "electrip-audio"
description = "Sound files and audio output for Electrip 2"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
electrip-core = { path = "../core" }
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis", "wav"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
