# `cargo deny check`: known advisories, licenses and sources of all dependencies.

[licenses]
# Unicode-3.0: unicode-ident, needed by every proc macro (serde derive, Slint).
# Zlib: SDL3 and zlib ports; permissive and GPL-compatible, allowed by Mo.
# MPL-2.0: symphonia, the decoder behind rodio named in AGENTS.md; GPL-compatible.
# BSD-3-Clause: encoding_rs, needed by symphonia for metadata; GPL-compatible.
# GPL-3.0-only: Slint (ADR 0001) under its GPL option; Electrip is then distributed under GPLv3.
# BSL-1.0, ISC, BSD-2-Clause: clipboard-win, error-code, libloading and others behind Slint's winit backend; permissive and GPL-compatible.
allow = ["MIT", "Apache-2.0", "GPL-3.0-or-later", "GPL-3.0-only", "Unicode-3.0", "Zlib", "MPL-2.0", "BSD-3-Clause", "BSD-2-Clause", "BSL-1.0", "ISC"]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
