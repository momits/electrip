# `cargo deny check`: known advisories, licenses and sources of all dependencies.

[licenses]
# Unicode-3.0: unicode-ident, needed by every proc macro (serde derive, Slint).
# Zlib: SDL3 and zlib ports; permissive and GPL-compatible, allowed by Mo.
allow = ["MIT", "Apache-2.0", "GPL-3.0-or-later", "Unicode-3.0", "Zlib"]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
