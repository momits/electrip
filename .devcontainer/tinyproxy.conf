# Local proxy for all outgoing traffic of the devcontainer (see init-sandbox.sh).
User tinyproxy
Group tinyproxy
Listen 127.0.0.1
Port 3128
Timeout 600
Allow 127.0.0.1
ConnectPort 443
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/allowlist"
LogFile "/var/log/tinyproxy/tinyproxy.log"
